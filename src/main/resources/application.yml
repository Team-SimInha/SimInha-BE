spring:
  datasource:
    url: jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true   # http://localhost:8080/h2-console 로 DB 확인 가능

# JWT 설정 (실서비스에서는 환경변수로 분리하세요)
jwt:
  secret: "change-this-to-a-long-random-secret-at-least-32-bytes!!"
  validity-ms: 86400000   # 24시간
